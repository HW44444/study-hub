<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub — Session</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">📚 Study Hub</a>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="planner.html">Session</a>
    <a href="testtime.html">Test Time</a>
    <a href="assignments.html">Assignments</a>
    <a href="grades.html">Grades</a>
  </div>
</nav>

<main class="wide">

  <!-- ================= BUILD MODE ================= -->
  <div id="buildMode">
    <h1>Study session</h1>
    <p class="sub">Plan what you'll do, in order, with a time for each. Then start and it runs you through it.</p>

    <div class="cols">

      <!-- ---------- LEFT: quick add ---------- -->
      <aside class="side">
        <div class="panel">
          <h2>Breaks</h2>
          <div class="chipwrap">
            <button class="chip" data-break="1">1 min</button>
            <button class="chip" data-break="3">3 min</button>
            <button class="chip" data-break="5">5 min</button>
            <button class="chip" data-break="10">10 min</button>
          </div>
        </div>

        <div class="panel">
          <h2>Quick work</h2>
          <div class="stack">
            <label class="sr-only" for="quickSubject">Subject</label>
            <select id="quickSubject"></select>

            <label class="sr-only" for="quickMins">Length</label>
            <select id="quickMins">
              <option value="5">5 min</option>
              <option value="10">10 min</option>
              <option value="25" selected>25 min</option>
              <option value="30">30 min</option>
              <option value="45">45 min</option>
              <option value="50">50 min</option>
            </select>

            <button id="quickAdd">+ Add to plan</button>
          </div>
        </div>
      </aside>

      <!-- ---------- CENTER: the plan ---------- -->
      <section>
        <div class="panel">
          <h2>Add a task</h2>
          <div class="row">
            <label class="sr-only" for="taskName">Task name</label>
            <input type="text" id="taskName" placeholder="What are you working on?" style="flex:2; min-width:170px;">
            <span class="with-unit" style="width:104px;">
              <label class="sr-only" for="taskMins">Minutes</label>
              <input type="number" id="taskMins" min="1" max="240" value="25">
              <span class="unit">min</span>
            </span>
            <button id="addTask">Add</button>
          </div>
        </div>

        <div class="panel">
          <h2>Your plan</h2>
          <div id="planList"></div>
          <p id="planTotal" class="sub" style="margin:14px 0 0;"></p>
          <div class="row" style="margin-top:14px;">
            <button id="startBtn">▶ Start session</button>
            <button class="ghost" id="clearPlan">Clear plan</button>
          </div>
        </div>
      </section>

      <!-- ---------- RIGHT: assignments ---------- -->
      <aside class="side">
        <div class="panel">
          <h2>Your assignments</h2>
          <p class="meta" style="color:var(--muted); margin:0 0 10px;">Set a time and add one to the plan.</p>
          <div id="assignSide"></div>
        </div>
      </aside>

    </div>
  </div>

  <!-- ================= RUNNER MODE ================= -->
  <div id="runMode" style="display:none;">
    <div class="panel runner">
      <div class="task" id="curTask">—</div>
      <div class="clock" id="clock">00:00</div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="upnext" id="upNext"></div>
      <div class="row" style="justify-content:center; margin-top:20px;">
        <button id="pauseBtn">Pause</button>
        <button class="ghost" id="skipBtn">Skip →</button>
        <button class="ghost" id="endBtn">End session</button>
      </div>
    </div>
  </div>

</main>

<script src="storage.js"></script>
<script src="ui.js"></script>
<script>
/* ===================== STATE ===================== */
let plan        = load(KEYS.plan, []);
let assignments = load(KEYS.assignments, []);
let classes     = load(KEYS.classes, []);

let index = 0;          // which task we're on
let endTime = 0;        // timestamp when the current task ends
let remaining = 0;      // seconds left
let ticker = null;
let paused = false;
let minutesDone = 0;
let finishedAssignments = new Set();  // assignment ids whose task ran to completion

/* ===================== LEFT SIDEBAR ===================== */
function fillSubjects() {
  const sel = document.getElementById("quickSubject");
  // Classes you entered on the Grades page become subjects here.
  const options = ["General study", ...classes.map(c => c.name)];
  sel.innerHTML = options
    .map(name => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
    .join("");
}

// Break chips
document.querySelectorAll("[data-break]").forEach(btn => {
  btn.addEventListener("click", () => {
    addToPlan({ name: "Break", minutes: +btn.dataset.break });
    uiToast(`${btn.dataset.break} min break added`);
  });
});

document.getElementById("quickAdd").addEventListener("click", () => {
  const subject = document.getElementById("quickSubject").value;
  const mins = +document.getElementById("quickMins").value;
  addToPlan({ name: subject, minutes: mins });
  uiToast(`${subject} · ${mins} min added`, "good");
});

/* ===================== RIGHT SIDEBAR ===================== */
function renderAssignSide() {
  const wrap = document.getElementById("assignSide");
  const open = assignments
    .filter(a => !a.done)
    .sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));

  if (open.length === 0) {
    wrap.innerHTML = `<p class="empty">Nothing open. <a href="assignments.html">Add one →</a></p>`;
    return;
  }

  wrap.innerHTML = open.map(a => {
    let due = "";
    if (a.due) {
      const d = daysUntil(a.due);
      due = d < 0 ? `${-d}d overdue` : d === 0 ? "Due today" : `${d}d left`;
    }
    return `
      <div class="mini">
        <div class="title">${escapeHtml(a.title)}</div>
        <div class="meta">${escapeHtml(a.className || "—")}${due ? " · " + due : ""}</div>
        <div class="row">
          <span class="with-unit">
            <label class="sr-only" for="m-${a.id}">Minutes for ${escapeHtml(a.title)}</label>
            <input type="number" id="m-${a.id}" min="1" max="240" value="25">
            <span class="unit">min</span>
          </span>
          <button data-addassign="${a.id}">+</button>
        </div>
      </div>`;
  }).join("");
}

document.getElementById("assignSide").addEventListener("click", e => {
  const btn = e.target.closest("button[data-addassign]");
  if (!btn) return;
  const id = btn.dataset.addassign;
  const a = assignments.find(x => x.id === id);
  const mins = parseInt(document.getElementById("m-" + id).value, 10);
  if (!a || !mins || mins < 1) { uiToast("Enter a number of minutes", "bad"); return; }

  // Keep the assignment id on the task so finishing it can
  // check the assignment off later.
  addToPlan({ name: a.title, minutes: mins, assignmentId: a.id });
  uiToast(`${a.title} added (${mins} min)`, "good");
});

/* ===================== PLAN ===================== */
function addToPlan(task) {
  plan.push(task);
  renderPlan();
}

function renderPlan() {
  const list = document.getElementById("planList");

  if (plan.length === 0) {
    list.innerHTML = `<p class="empty">Nothing planned yet. Add a task, or use the quick buttons.</p>`;
  } else {
    list.innerHTML = plan.map((task, i) => `
      <div class="item">
        <span class="meta">${i + 1}.</span>
        <div class="grow">
          <div class="title">${escapeHtml(task.name)}${task.assignmentId ? ` <span class="pill ok">assignment</span>` : ""}</div>
          <div class="meta">${task.minutes} min</div>
        </div>
        <button class="danger" data-up="${i}"   ${i === 0 ? "disabled" : ""} aria-label="Move up">↑</button>
        <button class="danger" data-down="${i}" ${i === plan.length - 1 ? "disabled" : ""} aria-label="Move down">↓</button>
        <button class="danger" data-del="${i}"  aria-label="Remove task">✕</button>
      </div>`).join("");
  }

  const total = plan.reduce((sum, t) => sum + t.minutes, 0);
  document.getElementById("planTotal").textContent =
    total ? `Total: ${formatMinutes(total)} across ${plan.length} task${plan.length === 1 ? "" : "s"}` : "";
  document.getElementById("startBtn").disabled = plan.length === 0;
  save(KEYS.plan, plan);
}

/* One listener handles reorder + delete for every row.
   Note the buttons carry their INDEX, so after any change we
   re-render and the indexes are correct again. */
document.getElementById("planList").addEventListener("click", e => {
  const btn = e.target.closest("button");
  if (!btn || btn.disabled) return;

  if (btn.dataset.del !== undefined) {
    plan.splice(+btn.dataset.del, 1);
  } else if (btn.dataset.up !== undefined) {
    const i = +btn.dataset.up;
    if (i > 0) [plan[i - 1], plan[i]] = [plan[i], plan[i - 1]];   // swap with the one above
  } else if (btn.dataset.down !== undefined) {
    const i = +btn.dataset.down;
    if (i < plan.length - 1) [plan[i + 1], plan[i]] = [plan[i], plan[i + 1]];
  } else {
    return;
  }
  renderPlan();
});

document.getElementById("addTask").addEventListener("click", addTask);
document.getElementById("taskName").addEventListener("keydown", e => { if (e.key === "Enter") addTask(); });

async function addTask() {
  const nameEl = document.getElementById("taskName");
  const name = nameEl.value.trim();
  const mins = parseInt(document.getElementById("taskMins").value, 10);
  if (!name) { await uiAlert("Give the task a name."); nameEl.focus(); return; }
  if (!mins || mins < 1) { await uiAlert("Minutes must be at least 1."); return; }
  addToPlan({ name, minutes: mins });
  nameEl.value = "";
  nameEl.focus();
}

document.getElementById("clearPlan").addEventListener("click", async () => {
  if (plan.length === 0) return;
  if (await uiConfirm("Clear the whole plan?", "Clear plan", "Clear")) {
    plan = [];
    renderPlan();
    uiToast("Plan cleared");
  }
});

/* ===================== RUNNER ===================== */
document.getElementById("startBtn").addEventListener("click", () => {
  index = 0;
  minutesDone = 0;
  finishedAssignments = new Set();
  document.getElementById("buildMode").style.display = "none";
  document.getElementById("runMode").style.display = "block";
  startTask();
});

function startTask() {
  const task = plan[index];
  document.getElementById("curTask").textContent = task.name;

  const next = plan[index + 1];
  document.getElementById("upNext").textContent =
    next ? `Up next: ${next.name} (${next.minutes} min)` : "Last task — finish strong.";

  remaining = task.minutes * 60;
  endTime = Date.now() + remaining * 1000;
  paused = false;
  document.getElementById("pauseBtn").textContent = "Pause";

  clearInterval(ticker);
  ticker = setInterval(tick, 250);
  tick();
}

/* Trust the clock, not a counter: we stored WHEN this task ends
   and recompute the remaining seconds every tick. Accurate even
   if the browser throttles a background tab. */
function tick() {
  if (paused) return;
  remaining = Math.max(0, Math.round((endTime - Date.now()) / 1000));
  draw();
  if (remaining <= 0) {
    beep();
    const task = plan[index];
    minutesDone += task.minutes;
    if (task.assignmentId) finishedAssignments.add(task.assignmentId);
    index++;
    if (index < plan.length) startTask();
    else finish();
  }
}

function draw() {
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  const text = String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  document.getElementById("clock").textContent = text;

  const total = plan[index].minutes * 60;
  document.getElementById("barFill").style.width = ((total - remaining) / total) * 100 + "%";
  document.title = `${text} — ${plan[index].name}`;
}

document.getElementById("pauseBtn").addEventListener("click", () => {
  paused = !paused;
  document.getElementById("pauseBtn").textContent = paused ? "Resume" : "Pause";
  // Resuming: rebuild the end time from whatever was left.
  if (!paused) endTime = Date.now() + remaining * 1000;
});

document.getElementById("skipBtn").addEventListener("click", () => {
  minutesDone += plan[index].minutes - Math.ceil(remaining / 60);
  index++;
  if (index < plan.length) startTask();
  else finish();
});

document.getElementById("endBtn").addEventListener("click", async () => {
  if (await uiConfirm("End the session early?", "End session", "End")) finish();
});

async function finish() {
  clearInterval(ticker);
  document.title = "Study Hub";
  if (minutesDone > 0) logStudyTime(minutesDone);

  document.getElementById("runMode").style.display = "none";
  document.getElementById("buildMode").style.display = "block";

  // Offer to check off the assignments you just worked through.
  const done = assignments.filter(a => finishedAssignments.has(a.id) && !a.done);
  if (done.length) {
    const picked = await uiChoose(
      "Mark these complete?",
      done.map(a => ({ id: a.id, label: a.title, sub: a.className || "" })),
      "Mark complete",
      "You finished study time for these assignments."
    );
    if (Array.isArray(picked) && picked.length) {
      assignments.forEach(a => { if (picked.includes(a.id)) a.done = true; });
      save(KEYS.assignments, assignments);
      renderAssignSide();
      uiToast(`${picked.length} assignment${picked.length === 1 ? "" : "s"} completed`, "good");
    }
  }

  await uiAlert(`You studied ${formatMinutes(minutesDone)}.`, "Session complete");
}

/* A short tone, generated in code so there's no sound file. */
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
    osc.start(); osc.stop(ctx.currentTime + 0.6);
  } catch (e) { /* audio blocked — not a problem */ }
}

/* ===================== INIT ===================== */
fillSubjects();
renderAssignSide();
renderPlan();
</script>
</body>
</html>
