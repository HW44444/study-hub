<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a class="logo" href="index.html">📚 Study Hub</a>
  <div class="links">
    <a href="index.html">Dashboard</a>
    <a href="planner.html">Session</a>
    <a href="testtime.html">Test Time</a>
    <a href="assignments.html">Assignments</a>
    <a href="grades.html">Grades</a>
    <a href="clock.html">Class clock</a>
  </div>
</nav>

<main>
  <h1 id="greeting">Dashboard</h1>
  <p class="sub" id="todayLine"></p>

  <div class="grid stats" style="margin-bottom:18px;">
    <div class="stat">
      <div class="label">Due this week</div>
      <div class="value" id="dueCount">0</div>
    </div>
    <div class="stat">
      <div class="label">
        Studied this week
        <button class="danger" id="resetWeek" title="Reset this week's total"
                aria-label="Reset studied time" style="float:right; padding:2px 7px; font-size:11px;">reset</button>
      </div>
      <div class="value" id="studyTime">0m</div>
      <div class="meta" style="color:var(--muted); font-size:11.5px;" id="weekNote"></div>
    </div>
    <div class="stat">
      <div class="label">Weighted GPA</div>
      <div class="value" id="gpa">—</div>
    </div>
  </div>

  <div class="panel">
    <h2>Coming up</h2>
    <div id="upcoming"></div>
  </div>

  <div class="panel">
    <h2>Jump in</h2>
    <div class="row">
      <a href="planner.html"><button>▶ Start a study session</button></a>
      <a href="testtime.html"><button class="ghost">Test Time timer</button></a>
      <a href="assignments.html"><button class="ghost">+ Add assignment</button></a>
    </div>
    <p class="sub" id="planHint" style="margin:14px 0 0;"></p>
  </div>
</main>

<script src="storage.js"></script>
<script src="ui.js"></script>
<script src="schedule.js"></script>
<script>
/* ---------- Greeting ---------- */
const hour = new Date().getHours();
document.getElementById("greeting").textContent =
  hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";

document.getElementById("todayLine").textContent =
  new Date().toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

/* ---------- Data from the other pages ---------- */
const assignments = load(KEYS.assignments, []);
const classes     = load(KEYS.classes, []);
const plan        = load(KEYS.plan, []);

const open = assignments.filter(a => !a.done);
document.getElementById("dueCount").textContent =
  open.filter(a => a.due && daysUntil(a.due) <= 7).length;

/* ---------- Study time (auto-resets Friday night) ---------- */
function paintStudyTime() {
  document.getElementById("studyTime").textContent = formatMinutes(minutesThisWeek());

  // Friday is day 5; show how long until the week rolls over.
  const today = new Date().getDay();
  const daysToFriday = (5 - today + 7) % 7;
  document.getElementById("weekNote").textContent =
    daysToFriday === 0 ? "resets tonight" : `resets in ${daysToFriday}d`;
}
paintStudyTime();

document.getElementById("resetWeek").addEventListener("click", async () => {
  if (await uiConfirm("Reset this week's study total to zero?", "Reset study time", "Reset")) {
    resetThisWeek();
    paintStudyTime();
    uiToast("Study time reset");
  }
});

/* ---------- GPA ---------- */
const GRADE_POINTS = {
  "A+":4.0,"A":4.0,"A-":3.7, "B+":3.3,"B":3.0,"B-":2.7,
  "C+":2.3,"C":2.0,"C-":1.7, "D+":1.3,"D":1.0,"D-":0.7, "F":0.0
};
const WEIGHT = { regular:0.0, honors:0.5, ap:1.0 };

if (classes.length) {
  const total = classes.reduce((sum, c) => {
    const base = GRADE_POINTS[c.grade] ?? 0;
    return sum + base + (base > 0 ? WEIGHT[c.type] : 0);
  }, 0);
  document.getElementById("gpa").textContent = (total / classes.length).toFixed(2);
}

/* ---------- Coming up ---------- */
const upcoming = open
  .filter(a => a.due)
  .sort((a, b) => a.due.localeCompare(b.due))
  .slice(0, 5);

const list = document.getElementById("upcoming");
if (upcoming.length === 0) {
  list.innerHTML = `<p class="empty">Nothing on the calendar.
    <a href="assignments.html">Add an assignment →</a></p>`;
} else {
  upcoming.forEach(a => {
    const d = daysUntil(a.due);
    const pill =
      d < 0  ? `<span class="pill late">${-d}d overdue</span>` :
      d === 0 ? `<span class="pill late">Due today</span>` :
      d <= 3  ? `<span class="pill soon">${d}d left</span>` :
                `<span class="pill ok">${d}d left</span>`;

    const row = document.createElement("div");
    row.className = "item";
    row.innerHTML = `
      <div class="grow">
        <div class="title">${escapeHtml(a.title)}</div>
        <div class="meta">${escapeHtml(a.className || "—")} · ${prettyDate(a.due)}</div>
      </div>
      ${pill}`;
    list.appendChild(row);
  });
}

/* ---------- Saved plan reminder ---------- */
if (plan.length) {
  const mins = plan.reduce((sum, t) => sum + t.minutes, 0);
  document.getElementById("planHint").textContent =
    `You have a saved plan: ${plan.length} task${plan.length === 1 ? "" : "s"}, ${formatMinutes(mins)}.`;
}
</script>
</body>
</html>
